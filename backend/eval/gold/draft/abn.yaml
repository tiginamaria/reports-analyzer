# Gold evaluation set for ABN AMRO (abn-2025 = FY2025 report, abn-2024 = FY2024 report).
# Page numbers are 1-based PDF pages as in eval/cache/pages/*.txt.

qa:
  # ---------------------------------------------------------------- 2025 factoids
  - id: abn-2025-cet1
    question: "How strong was ABN AMRO's core capital position (CET1) at year-end 2025?"
    type: factoid
    modality: text
    reports: [abn-2025]
    answer: "CET1 ratio of 15.4% at year-end 2025 (Basel IV)"
    key_facts: ["15.4"]
    evidence:
      - report: abn-2025
        page: 36
        quote: "This resulted in a CET1 ratio of 15.4% at year-end, compared with our 2026 target of 13.5%."
      - report: abn-2025
        page: 120
        quote: "The reported CET1 ratio of 15.4% is well above the MDA trigger level of 11.2%."
      - report: abn-2025
        page: 54
        quote: "NSFR 141% 137% Capital ratios CET1 ratio 15.4% 14.5% Total MREL 34.7% 34.6%"
    history: []
    notes: "Solo (ABN AMRO Bank N.V.) CET1 is 14.6% (p120); group consolidated 15.4% is the expected answer."

  - id: abn-2025-cost-income
    question: "What cost/income ratio did ABN AMRO report for 2025?"
    type: factoid
    modality: table
    reports: [abn-2025]
    answer: "64.4% in 2025 (2024: 61.7%)"
    key_facts: ["64.4"]
    evidence:
      - report: abn-2025
        page: 47
        quote: "Net interest margin (NIM) (in bps) 152 164 Cost/income ratio 64.4 % 61.7 %"
      - report: abn-2025
        page: 407
        quote: "Cost/income ratio 64.4% 61.7 % The cost/income ratio measures operating costs as a percentage of operating income."
      - report: abn-2025
        page: 20
        quote: "Right-size cost base 2025 Target (2028) Cost/income ratio 64.4% < 55%"
    history: []
    notes: "Best evidence is the key figures table (p47); p20 shows it against the 2028 target of <55%."

  - id: abn-2025-new-ceo
    question: "Who became the new CEO of ABN AMRO in 2025, and whom did she replace?"
    type: factoid
    modality: text
    reports: [abn-2025]
    answer: "Marguerite Bérard, who succeeded Robert Swaak as CEO at the AGM on 23 April 2025"
    key_facts: ["Marguerite Bérard", "Robert Swaak"]
    evidence:
      - report: abn-2025
        page: 15
        quote: "Marguerite Bérard succeeded Robert Swaak as Chief Executive Officer at the Annual General Meeting of Shareholders (AGM) on 23 April 2025."
    history: []
    notes: "Accept 'Berard' without accent."

  - id: abn-2025-renewable-financing
    question: "How much renewable energy financing had ABN AMRO provided by the end of 2025?"
    type: factoid
    modality: text
    reports: [abn-2025]
    answer: "EUR 5.8 billion by end-2025 (up from EUR 5.4 billion in 2024), towards a target of EUR 8 billion by 2028 / EUR 10 billion by 2030"
    key_facts: ["5.8"]
    evidence:
      - report: abn-2025
        page: 30
        quote: "By the end of 2025, we had financed EUR 5.8 billion in renewable energy, up from EUR 5.4 billion in 2024."
    history: []
    notes: "The ambitions table on p20 also shows 5.8 vs ambition 8 (2028) but without clear labelling in the dump."

  - id: abn-2025-women-senior-mgmt
    question: "What share of ABN AMRO's senior management positions were held by women in 2025?"
    type: factoid
    modality: table
    reports: [abn-2025]
    answer: "31% of senior management (Hay 14 or higher) in 2025, below the 35% target"
    key_facts: ["31%"]
    evidence:
      - report: abn-2025
        page: 32
        quote: "Women at senior management level (Hay 14 or higher) 31% 31% 35%"
    history: []
    notes: "Table columns are 2025, 2024, Target (2025). Do not confuse with Extended Leadership Team (34%) or Executive Board (50%)."

  # ---------------------------------------------------------------- 2024 factoids
  - id: abn-2024-cfo
    question: "Who was ABN AMRO's Chief Financial Officer during 2024?"
    type: factoid
    modality: text
    reports: [abn-2024]
    answer: "Ferdinand Vaandrager (CFO since 16 November 2023, interim CFO from 1 May 2023)"
    key_facts: ["Ferdinand Vaandrager"]
    evidence:
      - report: abn-2024
        page: 167
        quote: "As CFO, Ferdinand Vaandrager is responsible for Finance"
    history: []
    notes: ""

  - id: abn-2024-internal-fte
    question: "How many internal employees (in FTEs) did ABN AMRO have at the end of 2024?"
    type: factoid
    modality: table
    reports: [abn-2024]
    answer: "21,976 internal FTEs at end-2024 (plus 3,670 external FTEs)"
    key_facts: ["21,976"]
    evidence:
      - report: abn-2024
        page: 46
        quote: "Number of internal employees (end of period, in FTEs) 21,976 20,872"
    history: []
    notes: "Prose on p11 only says 'more than 21,000 people (FTEs)'. Headcount is 23,299 (p303). Company-only (Bank N.V.) figure 18,725 (p467) is not the group answer."

  - id: abn-2024-roe-target
    question: "What return on equity target for 2026 did ABN AMRO set out in its 2024 annual report?"
    type: factoid
    modality: text
    reports: [abn-2024]
    answer: "A 2026 target of 9-10% return on average equity (actual 2024: 10.1%)"
    key_facts: ["9-10%"]
    evidence:
      - report: abn-2024
        page: 36
        quote: "Our return on average equity was 10.1% in 2024, compared with a 2026 target of 9-10%."
      - report: abn-2024
        page: 18
        quote: "2024 2023 Target (2026) Return on average equity 10.1% 12.2% 9-10%"
    history: []
    notes: "Accept '9 to 10%'. The 2025 report replaced this with a >12% 2028 target (not the answer here)."

  - id: abn-2024-sustainable-asset-volume
    question: "What percentage of ABN AMRO's assets qualified as sustainability (acceleration) asset volume in 2024?"
    type: factoid
    modality: table
    reports: [abn-2024]
    answer: "37% in 2024 (target 36%; 2023: 34%)"
    key_facts: ["37%"]
    evidence:
      - report: abn-2024
        page: 29
        quote: "Total sustainability (acceleration) asset volume 36% 32% 37% 34%"
    history: []
    notes: "Table columns: Targets 2024, 2023 | Results 2024, 2023 -> result 37%, target 36%. An answer of 36% confuses target with result."

  - id: abn-2024-eps
    question: "What were ABN AMRO's earnings per share for 2024?"
    type: factoid
    modality: text
    reports: [abn-2024]
    answer: "EUR 2.72 per share in 2024 (2023: EUR 2.99)"
    key_facts: ["2.72"]
    evidence:
      - report: abn-2024
        page: 26
        quote: "Commercial • EUR 2.72 earnings per share • 10.1% return on equity"
      - report: abn-2024
        page: 43
        quote: "Key indicators per share (EUR) Earnings per share¹ 2.72 2.99"
    history: []
    notes: ""

  # ---------------------------------------------------------------- comparisons
  - id: abn-cmp-net-profit
    question: "How did ABN AMRO's net profit develop between 2024 and 2025?"
    type: comparison
    modality: table
    reports: [abn-2025, abn-2024]
    answer: "Net profit fell about 6%, from EUR 2,403 million (2024) to EUR 2,252 million (2025) (roughly EUR 2.4bn to EUR 2.3bn)"
    key_facts: ["2,252", "2,403"]
    evidence:
      - report: abn-2025
        page: 40
        quote: "Profit/(loss) for the period 2,252 2,403 -6%"
      - report: abn-2025
        page: 40
        quote: "achieving a net profit of EUR 2.3 billion and a return on equity of 8.7%"
      - report: abn-2024
        page: 40
        quote: "with a net profit of EUR 2.4 billion for 2024"
    history: []
    notes: "Accept rounded EUR 2.3bn vs EUR 2.4bn if direction (decrease) is stated."

  - id: abn-cmp-dividend
    question: "Did ABN AMRO pay a higher or lower dividend per share for 2025 than for 2024?"
    type: comparison
    modality: text
    reports: [abn-2025, abn-2024]
    answer: "Lower: total ordinary dividend of EUR 1.24 per share for 2025 vs EUR 1.35 for 2024 (both 50% payout)"
    key_facts: ["1.24", "1.35"]
    evidence:
      - report: abn-2025
        page: 121
        quote: "brings the total dividend for 2025 to EUR 1.24 per share (2024: EUR 1.35)"
      - report: abn-2025
        page: 41
        quote: "brings the total dividend for 2025 to EUR 1.24 per share"
      - report: abn-2024
        page: 43
        quote: "total dividend proposed for 2024 is EUR 1.35 per share"
    history: []
    notes: "Ambiguity: the 2025 key-figures table (p47) shows 'Dividend per share 1.54 1.35', which includes the additional EUR 250m cash distribution on top of the 1.24 ordinary dividend; an answer citing 1.54 (higher) should be treated as partially correct only if it explains the extra distribution."

  # ---------------------------------------------------------------- follow-up
  - id: abn-followup-roe
    question: "And what was it the year before?"
    type: followup
    modality: text
    reports: [abn-2025, abn-2024]
    answer: "10.1% return on equity in 2024"
    key_facts: ["10.1"]
    evidence:
      - report: abn-2025
        page: 47
        quote: "Return on equity for 2025 landed at 8.7%, compared with 10.1% in 2024."
      - report: abn-2024
        page: 46
        quote: "Return on equity for 2024 was above target at 10.1%, compared with 12.2% in 2023."
      - report: abn-2024
        page: 26
        quote: "EUR 2.72 earnings per share • 10.1% return on equity • 157 privacy-related complaints"
    history:
      - role: user
        content: "What return on equity did ABN AMRO achieve in 2025?"
      - role: assistant
        content: "ABN AMRO's return on equity was 8.7% in 2025."
    notes: "Follow-up refers to ROE in 2024."

  # ---------------------------------------------------------------- unanswerable
  - id: abn-unans-atms
    question: "How many ATMs did ABN AMRO operate in the Netherlands at the end of 2025?"
    type: unanswerable
    modality: text
    reports: [abn-2025]
    answer: ""
    key_facts: []
    evidence: []
    history: []
    notes: "Searched both reports for: ATM, ATMs, cash machine, cash dispenser, geldautomaat, pinautomaat, Geldmaat. No ATM count. Related: Geldmaat B.V. appears only in the list of participations (33.0% stake, p430 in 2025). Dutch bank ATMs are run by Geldmaat, so ABN AMRO reports none."

  - id: abn-unans-app-users
    question: "How many monthly active users did ABN AMRO's mobile banking app have in 2025?"
    type: unanswerable
    modality: text
    reports: [abn-2025]
    answer: ""
    key_facts: []
    evidence: []
    history: []
    notes: "Searched both reports for: monthly active, daily active, MAU, active users, app users, logins, log-ins, digitally active, app store, play store, stars, rating near 'app'. The mobile app is mentioned qualitatively (e.g. BUUT launch, joint account opening via app) but no user count is given."

  - id: abn-unans-savings-share
    question: "What was ABN AMRO's market share in Dutch savings deposits in 2024?"
    type: unanswerable
    modality: text
    reports: [abn-2024]
    answer: ""
    key_facts: []
    evidence: []
    history: []
    notes: "Searched both reports for: market share, savings market, deposit market share, share of savings/deposits. Related figure exists: market share of new Dutch mortgage production 19% (2024 p96, 2025 p92), and 'Dutch savings market' appears only in a lobbying context (2024 p331). No savings/deposit market share is disclosed."

