qa:
  # ---------------- asml-2025 factoids ----------------
  - id: asml-2025-net-income
    question: "What was ASML's net profit for 2025?"
    type: factoid
    modality: text
    reports: [asml-2025]
    answer: "Net income of EUR 9,609.4 million in 2025 (29.4% of total net sales; EUR 24.73 basic EPS)"
    key_facts: ["9,609.4"]
    evidence:
      - report: asml-2025
        page: 56
        quote: "Net income for 2025 amounted to €9,609.4 million, representing 29.4% of total net sales and €24.73 basic net income per ordinary share"
    history: []
    notes: "Also EUR 9.6bn acceptable in rounded form."
  - id: asml-2025-euv-units
    question: "How many EUV machines did ASML recognize as sold in 2025?"
    type: factoid
    modality: table
    reports: [asml-2025]
    answer: "48 EUV systems recognized in 2025 (2024: 44)"
    key_facts: ["48"]
    evidence:
      - report: asml-2025
        page: 53
        quote: "EUV systems recognized (in units) 48 2024: 44"
      - report: asml-2025
        page: 55
        quote: "We recognized four EXE and 44 NXE systems in sales in 2025"
    history: []
    notes: "48 = 4 EXE (High NA) + 44 NXE. Page 55 prose gives the split rather than the total."
  - id: asml-2025-backlog
    question: "How big was ASML's order backlog going into 2026?"
    type: factoid
    modality: text
    reports: [asml-2025]
    answer: "Backlog of around EUR 38.8 billion (as reported for the end of 2025)"
    key_facts: ["38.8"]
    evidence:
      - report: asml-2025
        page: 8
        quote: "Our backlog currently stands at a healthy level of €38.8 billion"
    history: []
    notes: "Question omits the literal year 2025 but refers to year-end 2025 position; the 2025 report no longer emphasises bookings."
  - id: asml-2025-china-share
    question: "What percentage of ASML's 2025 sales came from customers in China?"
    type: factoid
    modality: text
    reports: [asml-2025]
    answer: "29.1% of 2025 total net sales (down from 36.1% in 2024)"
    key_facts: ["29.1%"]
    evidence:
      - report: asml-2025
        page: 67
        quote: "Customers in China represented 29.1% of our 2025 total net sales and 36.1% of our 2024 net sales"
    history: []
    notes: ""
  - id: asml-2025-share-buyback
    question: "How much did ASML spend buying back its own shares in 2025?"
    type: factoid
    modality: text
    reports: [asml-2025]
    answer: "EUR 5,950.0 million (about EUR 5.9 billion) for 8,323,320 shares repurchased in 2025"
    key_facts: ["5,950.0"]
    evidence:
      - report: asml-2025
        page: 315
        quote: "In 2025, we repurchased 8,323,320 shares (2024: 574,925 shares) for a total consideration of €5,950.0 million (2024: €500.0 million)"
      - report: asml-2025
        page: 42
        quote: "Proposed annualized dividend per share 2024: €6.40 €5.9bn Share buyback 2024: €0.5bn"
    history: []
    notes: "Accept EUR 5.9bn / 5.95bn. Do not confuse with EUR 8.5bn total returned to shareholders (dividends + buybacks) or the EUR 7.6bn cumulative under the 2023-2025 program."
  # ---------------- asml-2024 factoids ----------------
  - id: asml-2024-rd-costs
    question: "How much did ASML invest in R&D during 2024?"
    type: factoid
    modality: text
    reports: [asml-2024]
    answer: "R&D costs of EUR 4,303.7 million (about EUR 4.3 billion) in 2024"
    key_facts: ["4,303.7"]
    evidence:
      - report: asml-2024
        page: 57
        quote: "R&D costs were €4,303.7 million in 2024 compared with €3,980.6 million in 2023"
      - report: asml-2024
        page: 6
        quote: "€28.3bn €4.3bn Total net sales R&D costs"
    history: []
    notes: "Rounded EUR 4.3bn acceptable; key fact could alternatively be '4.3'."
  - id: asml-2024-new-ceo
    question: "Who became ASML's chief executive in 2024, and whom did they replace?"
    type: factoid
    modality: text
    reports: [asml-2024]
    answer: "Christophe Fouquet was appointed President and CEO at the 2024 AGM (April 24, 2024), succeeding Peter Wennink (and co-President Martin van den Brink)"
    key_facts: ["Christophe Fouquet", "Peter Wennink"]
    evidence:
      - report: asml-2024
        page: 7
        quote: "At the 2024 AGM, Christophe Fouquet was appointed President, Chief Executive Officer and Chair of the Board of Management of ASML, succeeding Peter Wennink"
      - report: asml-2024
        page: 142
        quote: "Christophe D. Fouquet was appointed as President and CEO of ASML on April 24, 2024"
    history: []
    notes: "Wennink and Van den Brink were co-Presidents; mentioning only Wennink is acceptable."
  - id: asml-2024-scope12-emissions
    question: "What were ASML's combined scope 1 and 2 greenhouse gas emissions in 2024?"
    type: factoid
    modality: table
    reports: [asml-2024]
    answer: "32.8 kt CO2e scope 1 and 2 emissions in 2024"
    key_facts: ["32.8"]
    evidence:
      - report: asml-2024
        page: 6
        quote: "€22.4bn Asia (headcount) 32.8 kt Scope 1 and 2 CO2e emissions"
      - report: asml-2024
        page: 194
        quote: "32.8 kt 12.0 Mt Scope 1 and 2 CO2e emissions Scope 3 CO2e emissions"
    history: []
    notes: "Elsewhere rounded to 33 kt (e.g. p206 'from 60 kt to 33 kt'); 33 kt acceptable. The 2025 report also restates 2024 as 33 kt."
  - id: asml-2024-fte
    question: "How many full-time-equivalent staff did ASML have at the end of 2024?"
    type: factoid
    modality: table
    reports: [asml-2024]
    answer: "44,027 FTEs (payroll and temporary employees, as of December 31, 2024)"
    key_facts: ["44,027"]
    evidence:
      - report: asml-2024
        page: 6
        quote: "12.0 Mt 44,027 Total employees (FTEs) 86% Customer satisfaction"
      - report: asml-2024
        page: 358
        quote: "Research and Development 14,181 15,604 15,992 Total 39,086 42,416 44,027"
    history: []
    notes: "Alternatives: 42,786 payroll FTE (excl. 1,241 temporary); 41,697 average payroll FTE; 43,395 headcount; 'more than 44,000'."
  - id: asml-2024-dividend
    question: "What total dividend per share did ASML declare for financial year 2024?"
    type: factoid
    modality: text
    reports: [asml-2024]
    answer: "EUR 6.40 per ordinary share for 2024, a 4.9% increase on EUR 6.10 for 2023"
    key_facts: ["6.40"]
    evidence:
      - report: asml-2024
        page: 372
        quote: "ASML intends to declare a total dividend for the year of 2024 of €6.40 per ordinary share, which is a 4.9% increase"
      - report: asml-2024
        page: 138
        quote: "this leads to a total dividend of €6.40 per ordinary share for the year 2024"
      - report: asml-2024
        page: 381
        quote: "ASML announced to declare a total dividend for the year 2024 of €6.40 per ordinary share"
    history: []
    notes: "Do not confuse with EUR 2.5bn total dividends paid in 2024."
  # ---------------- comparisons ----------------
  - id: asml-net-sales-2024-vs-2025
    question: "How did ASML's revenue develop between 2024 and 2025?"
    type: comparison
    modality: table
    reports: [asml-2025, asml-2024]
    answer: "Total net sales rose from EUR 28.3 billion (28,262.9m) in 2024 to EUR 32.7 billion (32,667.3m) in 2025, an increase of EUR 4.4 billion or 15.6%"
    key_facts: ["28.3", "32.7", "15.6%"]
    evidence:
      - report: asml-2025
        page: 54
        quote: "Total net sales 28,262.9 100.0 32,667.3 100.0 15.6"
      - report: asml-2025
        page: 54
        quote: "In 2025, total net sales increased by €4.4 billion, representing a 15.6% year-over-year increase"
      - report: asml-2024
        page: 55
        quote: "Total net sales Gross profit % of total net sales Cash and cash equivalents and short-term investments (year end) €28.3bn"
    history: []
    notes: "Full precision figures acceptable (28,262.9 / 32,667.3 million)."
  - id: asml-gross-margin-2024-vs-2025
    question: "Did ASML's gross margin improve in 2025 compared with 2024?"
    type: comparison
    modality: text
    reports: [asml-2025, asml-2024]
    answer: "Yes: gross margin rose from 51.3% in 2024 to 52.8% in 2025, up 1.5 percentage points"
    key_facts: ["51.3%", "52.8%"]
    evidence:
      - report: asml-2025
        page: 8
        quote: "The gross margin was 52.8%, up by 1.5 percentage points from 2024"
      - report: asml-2024
        page: 7
        quote: "Our gross margin was 51.3%, similar to last year"
      - report: asml-2025
        page: 53
        quote: "€32.7bn €17.3bn 52.8% €13.3bn 2024: €28.3bn 2024: €14.5"
    history: []
    notes: ""
  # ---------------- follow-up ----------------
  - id: asml-litho-units-followup
    question: "And how many did it sell the year before?"
    type: followup
    modality: text
    reports: [asml-2025, asml-2024]
    answer: "418 lithography systems in 2024 (vs. 327 in 2025)"
    key_facts: ["418"]
    evidence:
      - report: asml-2025
        page: 66
        quote: "lithography systems (327 units in 2025, 418 units in 2024 and 449 units in 2023)"
      - report: asml-2024
        page: 67
        quote: "lithography systems (418 units in 2024, 449 units in 2023 and 345 units in 2022)"
      - report: asml-2025
        page: 53
        quote: "Sales of lithography systems (in units)1 Earnings per share (basic) 327 €24.73 2024: 418"
    history:
      - role: user
        content: "How many lithography systems did ASML sell in 2025?"
      - role: assistant
        content: "ASML sold 327 lithography systems in 2025 (excluding metrology and inspection systems)."
    notes: "Lithography units exclude metrology & inspection. Total net system sales incl. M&I were 583 units in 2024 (535 in 2025) - an answer of 583 is defensible only if clearly labelled as all systems incl. metrology/inspection."
  # ---------------- unanswerable ----------------
  - id: asml-unans-tsmc-share
    question: "What share of ASML's 2025 revenue came from TSMC?"
    type: unanswerable
    modality: text
    reports: [asml-2025]
    answer: "Not disclosed. The report gives the largest customer's share (23.9% of 2025 net sales) and top-two share (38.0%) but does not name the customers, so TSMC's share cannot be determined."
    key_facts: []
    evidence: []
    history: []
    notes: "Searched: TSMC, Taiwan Semiconductor, largest customer, two largest customers, customer concentration, Samsung, Intel. TSMC is mentioned only for an award (p173) and glossary; largest customer unnamed (p68). A good answer may mention the unnamed largest-customer figure while stating TSMC is not identified."
  - id: asml-unans-high-na-2026-shipments
    question: "How many High NA EUV systems does ASML plan to ship in 2026?"
    type: unanswerable
    modality: text
    reports: [asml-2025]
    answer: "Not stated. The report says the EXE platform is expected to support high-volume manufacturing in 2027 but gives no unit shipment plan for 2026."
    key_facts: []
    evidence: []
    history: []
    notes: "Searched: EXE, High NA, 'ship ... 2026', 'units in 2026', 'deliver ... 2026', 'next year', capacity of N systems. Only 2025 actuals (4 EXE recognized) and HVM timing (2027, p17) found. Note: average High NA price is derivable from p286 (4 EXE for EUR 1,156.9m), so price was rejected as unanswerable."
  - id: asml-unans-china-2030
    question: "How much revenue does ASML expect to generate from China in 2030?"
    type: unanswerable
    modality: text
    reports: [asml-2024, asml-2025]
    answer: "Not stated. ASML gives a 2030 total revenue opportunity (approx. EUR 44-60 billion, in the 2024 report) but no regional or China-specific 2030 revenue expectation."
    key_facts: []
    evidence: []
    history: []
    notes: "Searched: China near 2027/2028/2030 (both directions), 'China' + 'expect', 'normalized sales levels to China', 2030 revenue opportunity, regional outlook. Only historic China shares (29.1% 2025, 36.1% 2024) and qualitative 'more normalized sales levels to China' (2024 p34)."

