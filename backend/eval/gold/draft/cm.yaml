      - label: "Renewable electricity for data center colocations"
        target: "ensure purchase of renewable electricity for rented data centers (colocations)"
        year: ""
        core: false
        page: 122
        quote: "We aim to ensure the purchase of renewable electricity for our rented data centers (colocations)"
      - label: "Climate transition plan with GHG targets"
        target: "present draft transition plan with short-, medium- and long-term GHG reduction targets to the Management Board"
        year: "2025"
        core: false
        page: 123
        quote: "Our ESG manager will present a draft of this transition plan, including proposed short-, medium-, and long-term targets, to the Management Board in H1 2025."
