# Gold evaluation set for CM.com (cm-2025 = FY2025 report, cm-2024 = FY2024 report).
# Page numbers are 1-based PDF pages.
qa:
  # ---------------- cm-2025 factoids ----------------
  - id: cm-2025-adjusted-ebitda
    question: "What was CM.com's adjusted EBITDA for 2025?"
    type: factoid
    modality: table
    reports: [cm-2025]
    answer: "EUR 19.8 million (2024: EUR 18.1 million)"
    key_facts: ["19.8"]
    evidence:
      - report: cm-2025
        page: 16
        quote: "Operating result, Adjusted EBITDA 19.8 18.1 (0.9) (22.3) (3.7)"
      - report: cm-2025
        page: 17
        quote: "Adjusted EBITDA (€ million) Net result (€ million) 94.3 19.8 18.1"
    history: []
    notes: "Reported (unadjusted) EBITDA was EUR 18.4 million; an answer giving 18.4 confuses EBITDA with adjusted EBITDA. Only stated in tables/charts in the 2025 report."
  - id: cm-2025-new-cfo
    question: "Who is taking over as CFO of CM.com after Jörg de Graaf left in 2025?"
    type: factoid
    modality: text
    reports: [cm-2025]
    answer: "Geert Beullens (incoming CFO, ex-ASML; nomination to be presented at the April 2026 AGM). Jörg de Graaf stepped down on November 1, 2025."
    key_facts: ["Geert Beullens"]
    evidence:
      - report: cm-2025
        page: 43
        quote: "We are pleased to welcome Geert Beullens as incoming CFO."
      - report: cm-2025
        page: 5
        quote: "We are delighted to welcome Geert Beullens as our incoming CFO."
    history: []
    notes: ""
  - id: cm-2025-arr
    question: "How much annual recurring revenue did CM.com have at the end of 2025?"
    type: factoid
    modality: text
    reports: [cm-2025]
    answer: "EUR 35.9 million ARR at end of 2025 (up 7%)"
    key_facts: ["35.9"]
    evidence:
      - report: cm-2025
        page: 2
        quote: "Annual recurring revenue (ARR)* 2025 € 35.9m"
    history: []
    notes: "p4 states a 7% increase in ARR without the absolute figure."
  - id: cm-2025-ghg-market-based
    question: "What were CM.com's total market-based greenhouse gas emissions in 2025?"
    type: factoid
    modality: table
    reports: [cm-2025]
    answer: "271 tCO2e (scope 1 and 2 only, market-based); location-based 666 tCO2e"
    key_facts: ["271"]
    evidence:
      - report: cm-2025
        page: 73
        quote: "Total GHG emissions (market-based) 271 288 370 (27%)"
    history: []
    notes: "2025 report covers scope 1 and 2 only (scope 3 no longer disclosed under phase-in). Location-based total is 666 tCO2e; mentioning both is fine but 271 is the market-based figure."
  - id: cm-2025-women-senior-management
    question: "What share of CM.com's senior management were women in 2025?"
    type: factoid
    modality: text
    reports: [cm-2025]
    answer: "38.7% (up from 36.1% in 2024)"
    key_facts: ["38.7%"]
    evidence:
      - report: cm-2025
        page: 38
        quote: "a slight increase in the representation of women in Senior Management to 38.7% in 2025 (2024: 36.1%)"
    history: []
    notes: "Also in the table on p39 (12 women, 38.7%)."

  # ---------------- cm-2024 factoids ----------------
  - id: cm-2024-messages
    question: "How many messages did CM.com process in 2024?"
    type: factoid
    modality: text
    reports: [cm-2024]
    answer: "8.3 billion messages (up 18% from 7.0 billion in 2023)"
    key_facts: ["8.3 billion"]
    evidence:
      - report: cm-2024
        page: 62
        quote: "Underlying number of messages grew 18% to 8.3 billion"
      - report: cm-2024
        page: 58
        quote: "Number of messages (billion) 8.3 7.0 +18%"
    history: []
    notes: ""
  - id: cm-2024-free-cash-flow
    question: "Was CM.com's free cash flow positive in 2024, and how much was it?"
    type: factoid
    modality: text
    reports: [cm-2024]
    answer: "Yes, free cash flow for full-year 2024 was EUR 3.4 million positive (H2 2024: EUR 4.7 million)"
    key_facts: ["3.4"]
    evidence:
      - report: cm-2024
        page: 63
        quote: "As a result overall Free Cash Flow for 2024 turned € 3.4 million positive"
    history: []
    notes: "EUR 4.7 million is the H2 2024 figure only; not acceptable as the full-year answer."
  - id: cm-2024-offices
    question: "How many offices did CM.com have worldwide in 2024, and in how many countries?"
    type: factoid
    modality: text
    reports: [cm-2024]
    answer: "23 offices in 15 countries (year-end 2024)"
    key_facts: ["23", "15"]
    evidence:
      - report: cm-2024
        page: 5
        quote: "With 666 FTE and 23 ofﬁces in 15 countries globally"
    history: []
    notes: "Quote contains the 'ﬁ' ligature as in the extracted text."
  - id: cm-2024-ghg-total-market-based
    question: "What was CM.com's total carbon footprint (market-based, all scopes) in 2024?"
    type: factoid
    modality: table
    reports: [cm-2024]
    answer: "4,676 tCO2e market-based (scope 1, 2 and 3), down 13% from 5,352 in 2023; location-based 5,126 tCO2e"
    key_facts: ["4,676"]
    evidence:
      - report: cm-2024
        page: 124
        quote: "Total GHG emissions (market-based) 4,676 5,352 (13%)"
      - report: cm-2024
        page: 125
        quote: "Total GHG emissions (market-based) in tCO2 4,676 5,352 (13%)"
    history: []
    notes: "The 2025 report restates 2024 as 288 tCO2e, but that is scope 1+2 only; the question asks for all scopes, so 4,676 from the 2024 report is the gold answer. Scope 3 alone was 4,388."
  - id: cm-2024-employee-engagement
    question: "What employee engagement score did CM.com achieve in 2024?"
    type: factoid
    modality: text
    reports: [cm-2024]
    answer: "73 (2023: 69), against a target of 80"
    key_facts: ["73"]
    evidence:
      - report: cm-2024
        page: 136
        quote: "During 2024, CM.com scored 73 (2023: 69)."
    history: []
    notes: ""

  # ---------------- comparisons ----------------
  - id: cm-revenue-change-2024-2025
    question: "How did CM.com's revenue develop between 2024 and 2025?"
    type: comparison
    modality: table
    reports: [cm-2025, cm-2024]
    answer: "Revenue fell from EUR 274.2 million in 2024 to EUR 259.4 million in 2025, a decrease of about 5%"
    key_facts: ["274.2", "259.4"]
    evidence:
      - report: cm-2025
        page: 16
        quote: "2025 2024 2023 2022 2021 Revenue 259.4 274.2 266.2 283.2 237.0"
      - report: cm-2025
        page: 2
        quote: "FTE Year-End 2025 616 countries 15 Revenue 2025 € 259.4m"
      - report: cm-2024
        page: 58
        quote: "FY 2024 FY 20231 ∆ Y-Y 2024 2023 Δ Revenue 274.2 266.2 3%"
      - report: cm-2024
        page: 5
        quote: "Limited CPaaS churn3 Total 2024 revenue +6% 30.3% € 274.2m"
    history: []
    notes: "p55 of cm-2025 gives revenue in EUR thousands (274,249 -> 259,394, -5%)."
  - id: cm-fte-change-2024-2025
    question: "How did CM.com's year-end headcount in FTE change from 2024 to 2025?"
    type: comparison
    modality: text
    reports: [cm-2025, cm-2024]
    answer: "Year-end FTE decreased from 666 at end-2024 to 616 at end-2025 (about -50 FTE, -7.5%)"
    key_facts: ["666", "616"]
    evidence:
      - report: cm-2025
        page: 2
        quote: "Extensive telecom network 1999 FTE Year-End 2025 616"
      - report: cm-2024
        page: 63
        quote: "the FTE base ended 7.5% lower YoY at 666"
      - report: cm-2024
        page: 5
        quote: "With 666 FTE and 23 ofﬁces in 15 countries globally"
    history: []
    notes: "p18 of cm-2025 shows the FTE chart (666 -> 616) but values are scrambled in extraction. Average FTE was 675 (2024) and 648 (2025); headcount 705 -> 646. An answer based on average FTE (675 -> 648) is partially acceptable but not the gold."

  # ---------------- followup ----------------
  - id: cm-net-result-followup
    question: "And what was it the year before?"
    type: followup
    modality: table
    reports: [cm-2025, cm-2024]
    answer: "In 2024 CM.com had a net loss of EUR 19.8 million (net result EUR -19.8 million)"
    key_facts: ["19.8"]
    evidence:
      - report: cm-2025
        page: 16
        quote: "Result after tax (3.8) (19.8) (28.7) (44.7) (17.5)"
      - report: cm-2024
        page: 58
        quote: "Share of results in associates - (0.6) Net result (19.8) (28.7)"
      - report: cm-2024
        page: 59
        quote: "Net result (19.8) (28.7) (44.7) (17.5) (13.0)"
    history:
      - role: user
        content: "What was CM.com's net result in 2025?"
      - role: assistant
        content: "CM.com reported a net loss of EUR 3.8 million for 2025."
    notes: "Exact figure in EUR thousands: (19,813) consolidated."

  # ---------------- unanswerable ----------------
  - id: cm-2025-scope3-unanswerable
    question: "What were CM.com's scope 3 emissions in 2025?"
    type: unanswerable
    modality: text
    reports: [cm-2025]
    answer: "Not disclosed: the 2025 report applies phase-in provisions and no longer reports scope 3 emissions for 2025."
    key_facts: []
    evidence: []
    history: []
    notes: "cm-2025 p70 and p73 explicitly state scope 3 is no longer disclosed for 2025. Searched cm-2025 for 'scope 3', 'scope three', 'value chain emissions', 'purchased goods', 'business travel' emissions figures: none for 2025. The 2024 report gives 2024 scope 3 (4,388 tCO2e) - returning that is wrong."
  - id: cm-2024-patents-unanswerable
    question: "How many patents did CM.com hold in 2024?"
    type: unanswerable
    modality: text
    reports: [cm-2024, cm-2025]
    answer: "Not stated in either report."
    key_facts: []
    evidence: []
    history: []
    notes: "Searched both reports for 'patent', 'patented', 'trademark', 'intellectual property', 'IP rights': 0 hits."
  - id: cm-2025-water-unanswerable
    question: "How much water did CM.com consume in 2025?"
    type: unanswerable
    modality: text
    reports: [cm-2025, cm-2024]
    answer: "Not stated; neither report discloses water consumption."
    key_facts: []
    evidence: []
    history: []
    notes: "Searched for 'water consumption', 'water usage', 'water withdrawal', 'water' (only EU Taxonomy objective names and water-related climate risk), 'm3', 'm³', 'cubic', 'litre/liter' (only fuel liters): no water figures."

fte:
  - report: cm-2025
    value: "616"
    numeric: 616
    basis: year-end
    unit: FTE
    page: 2
    quote: "Extensive telecom network 1999 FTE Year-End 2025 616"
    notes: "Same figure in the FTE trend chart on p18 (excl. interns, end of period)."
    alternatives:
      - {value: "648", numeric: 648, meaning: "average FTE during 2025 (note 21 employee benefits; also remuneration 5-year table)", page: 124}
      - {value: "646", numeric: 646, meaning: "total headcount per 31 December 2025 (sustainability statements)", page: 81}
  - report: cm-2024
    value: "666"
    numeric: 666
    basis: year-end
    unit: FTE
    page: 63
    quote: "the FTE base ended 7.5% lower YoY at 666"
    notes: "Same year-end 666 FTE also on p5 (profile) and p22 (People and Culture key figures)."
    alternatives:
      - {value: "675", numeric: 675, meaning: "average FTE during 2024 (note 22 employee benefits)", page: 178}
      - {value: "705", numeric: 705, meaning: "total headcount per 31 December 2024 (sustainability statements)", page: 133}
      - {value: "over 650", numeric: 650, meaning: "rounded mention in COO interview", page: 19}

sustainability_goals:
  - report: cm-2025
    notes: "No GHG emission reduction targets set (p72: still formalising target setting; p93: transition plan not adopted, no targets). Goals are mainly diversity, engagement and training. Financial ambitions towards 2028 (p24) are not sustainability goals."
    goals:
      - label: "Women on the Supervisory Board"
        target: "at least 33% of Supervisory Board members are women"
        year: ""
        core: true
        page: 82
        quote: "ensuring at least 33% of our Supervisory Board and 30% of our Senior Management are women"
      - label: "Women in Senior Management"
        target: "at least 30% women in Senior Management"
        year: "2027"
        core: true
        page: 82
        quote: "ensuring at least 33% of our Supervisory Board and 30% of our Senior Management are women"
      - label: "Women on the Management Board"
        target: "at least 30% female representation in the Management Board"
        year: "2032"
        core: true
        page: 82
        quote: "we aim for at least 30% female representation in our Management Board by 2032"
      - label: "Women in the Executive Committee"
        target: "30.0% women in the Executive Committee"
        year: "2027"
        core: false
        page: 39
        quote: "5 100% 0 0% 30.0% 2027 Executive Committee"
      - label: "Women in leadership roles (LTIP 2025-2027)"
        target: "33% women in leadership roles (on-target LTIP)"
        year: "2027"
        core: true
        page: 61
        quote: "measured as the percentage of women in leadership roles (on target: 33% women in leadership roles)"
      - label: "Employee engagement score"
        target: "employee engagement score of 75 over 2027 (LTIP 2025-2027 on-target)"
        year: "2027"
        core: true
        page: 84
        quote: "The on target score for LTIP 2025-2027 is set on 75 over 2027."
      - label: "Learning and development participation"
        target: "95% of employees participate in at least one learning or development activity annually"
        year: "annual"
        core: false
        page: 86
        quote: "aiming that 95% of our employees (excluding employees on parental or long-term sickness leave) participate in at least one learning or development activity annually"
      - label: "Mandatory security and compliance training completion"
        target: "95% completion rate for mandatory security and compliance training within set timeframes"
        year: "from 2025"
        core: false
        page: 88
        quote: "Starting in 2025, we aim for a 95% completion rate for mandatory security and compliance training within set timeframes."
      - label: "No new fossil fuel vehicles"
        target: "avoid acquiring or leasing new fossil fuel vehicles"
        year: ""
        core: false
        page: 71
        quote: "CM.com aims to avoid acquiring or leasing new fossil fuel vehicles"
      - label: "Renewable electricity for remaining offices"
        target: "switch remaining offices to renewable electricity contracts where feasible"
        year: ""
        core: false
        page: 71
        quote: "Where feasible, we plan to switch the remaining offices to renewable electricity contracts."
      - label: "Annual leadership training"
        target: "make the leadership training an annual initiative for all team leads"
        year: "annual"
        core: false
        page: 86
        quote: "We aim to make this leadership training an annual initiative, ensuring all team leads are equipped to lead with impact."
  - report: cm-2024
    notes: "No GHG targets yet; a transition plan with short/medium/long-term GHG targets was to be presented to the Management Board in H1 2025 (p123). Senior Management target year conflicts: p134 says 2025, the governance table on p71 says 2027."
    goals:
      - label: "Women on the Supervisory Board"
        target: "at least 33% of Supervisory Board members are women"
        year: ""
        core: true
        page: 134
        quote: "we are committed to maintaining gender diversity so that at least 33% of our Supervisory Board are women"
      - label: "Women in Senior Management"
        target: "at least 30% female representation in Senior Management"
        year: "2025"
        core: true
        page: 134
        quote: "We have also set a target of having at least 30% female representation in our Senior Management and Management Board by 2025 and 2032."
      - label: "Women on the Management Board"
        target: "at least 30% female representation in the Management Board"
        year: "2032"
        core: true
        page: 134
        quote: "We have also set a target of having at least 30% female representation in our Senior Management and Management Board by 2025 and 2032."
      - label: "Women in the Executive Committee"
        target: "30.0% women in the Executive Committee"
        year: "2027"
        core: false
        page: 71
        quote: "7 0 100% 0% 30.0% 2027 Executive Committee"
      - label: "Women in leadership roles (LTIP 2024-2026)"
        target: "33% women in leadership roles (on-target LTIP)"
        year: "2026"
        core: true
        page: 112
        quote: "In LTIP 2024-2026, we have included a clear target on gender diversity concerning female leadership"
      - label: "Employee engagement score 2026"
        target: "employee engagement score of 75 for 2026 (LTIP 2024-2026 on-target)"
        year: "2026"
        core: true
        page: 112
