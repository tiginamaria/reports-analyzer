      - label: "Mandatory security and compliance training completion"
        target: "95% completion of mandatory security and compliance training within designated timeframes"
        year: "from 2025"
        core: false
        page: 139
        quote: "starting from 2025, there will be a target for employees of 95% completion of mandatory security and compliance training"
      - label: "No new fossil fuel vehicles"
        target: "not acquire or lease any new fossil fuel vehicles"
        year: ""
        core: false
        page: 122
        quote: "We aim not to acquire or lease any new fossil fuel vehicles."
      - label: "Renewable electricity for remaining offices"
        target: "switch contracts to renewable electricity for remaining offices where feasible"
        year: ""
        core: false
        page: 122
