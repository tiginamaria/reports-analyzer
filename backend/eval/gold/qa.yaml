  - report: abn-2024
    page: 40
    quote: with a net profit of EUR 2.4 billion for 2024
  history: []
  notes: Accept rounded EUR 2.3bn vs EUR 2.4bn if direction (decrease) is stated.
- id: abn-cmp-dividend
  question: Did ABN AMRO pay a higher or lower dividend per share for 2025 than for 2024?
  type: comparison
  modality: text
  reports:
  - abn-2025
  - abn-2024
  answer: 'Lower: total ordinary dividend of EUR 1.24 per share for 2025 vs EUR 1.35 for 2024 (both 50%
    payout)'
  key_facts:
  - '1.24'
  - '1.35'
  evidence:
  - report: abn-2025
    page: 121
    quote: 'brings the total dividend for 2025 to EUR 1.24 per share (2024: EUR 1.35)'
  - report: abn-2025
    page: 41
    quote: brings the total dividend for 2025 to EUR 1.24 per share
  - report: abn-2024
    page: 43
    quote: total dividend proposed for 2024 is EUR 1.35 per share
  history: []
  notes: 'Ambiguity: the 2025 key-figures table (p47) shows ''Dividend per share 1.54 1.35'', which includes
    the additional EUR 250m cash distribution on top of the 1.24 ordinary dividend; an answer citing 1.54
    (higher) should be treated as partially correct only if it explains the extra distribution.'
