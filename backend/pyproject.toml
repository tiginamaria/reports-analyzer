[project]
name = "reports-analyzer-backend"
version = "0.1.0"
description = "RAG backend for analysing annual reports"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "python-multipart>=0.0.9",
    "pymupdf>=1.24",
    "sentence-transformers>=3.0",
    "torch>=2.3",
    "anthropic>=1.0",
    "openai>=1.50",
    "pyyaml>=6.0",
    "sse-starlette>=2.1",
    "rapidfuzz>=3.14.6",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",  # fastapi.testclient
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
]

[tool.uv]
index-strategy = "unsafe-best-match"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]  # FastAPI Depends() idiom; formatter owns line width

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs Postgres and the embedding model"]
