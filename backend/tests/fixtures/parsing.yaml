# Parser quality dataset: selected pages cut from the real annual reports
# (tests/fixtures/pdf/*.pdf). `page` is the 1-based page inside the fixture file,
# `source_page` the page in the original report, for reference.
#
# Expectations per page:
#   text_contains  verbatim snippets that must appear in the extracted page text
#   table_cells    values that must appear inside a detected table on the page
#   no_tables      true when the page has no real table and none should be detected
#   order          [earlier, later] snippets; `earlier` must come first in the page text

- file: abn-amro.pdf
  company: ABN AMRO
  pages:
    - page: 1
      source_page: 14
      kind: infographic
      text_contains: ["19,916", "20,455", "Internal & external full-time equivalents"]
    - page: 2
      source_page: 15
      kind: two-column text
      text_contains: ["net reduction of the workforce by 5,200 full-time equivalents (FTEs) by 2028"]
      no_tables: true
      order: [["Year in review", "Board changes"]]
    - page: 3
      source_page: 19
      kind: text
      text_contains: ["reaching net-zero emissions by 2050"]
      no_tables: true
    - page: 4
      source_page: 47
      kind: financial tables
      text_contains: ["Number of internal employees (end of period, in FTEs)", "23,126", "21,976"]
      table_cells: ["23,126", "21,976", "135,764"]
    - page: 5
      source_page: 256
      kind: text table
      text_contains: ["DE&I"]
      table_cells: ["Focus Area", "Programmes & Activities 2025"]

